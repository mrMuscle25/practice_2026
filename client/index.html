<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>WebSocket Client</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="client-block">
        <h1>WebSocket Client1</h1>
        <h2>Connection Status:</h2>
        <div id="output1"></div>
        <div id="data-table-container1"></div>
    </div>

    <div class="client-block">
        <h1>WebSocket Client2</h1>
        <h2>Connection Status:</h2>
        <div id="output2"></div>
        <div id="data-table-container2"></div>
    </div>

    <div class="client-block">
        <h1>WebSocket Client3</h1>
        <h2>Connection Status:</h2>
        <div id="output3"></div>
        <div id="data-table-container3"></div>
    </div>

    <script>
        const output1 = document.getElementById('output1');
        const container1 = document.getElementById('data-table-container1');

        const output2 = document.getElementById('output2');
        const container2 = document.getElementById('data-table-container2');

        const output3 = document.getElementById('output3');
        const container3 = document.getElementById('data-table-container3');

        const reconnectionInterval = 5000;

        function connectWebSocket(url, output, dataTableContainer) {
            let socket = null;
            let isConnected = false; 

            socket = new WebSocket(url);

            socket.onopen = () => {
                output.innerHTML += '<p class="open">Соединение установлено</p>';
                isConnected = true;
                removeStatusMessage(output, 'close', "Соединение закрыто");
                removeStatusMessage(output, 'error', "Ошибка:");
            };

            socket.onmessage = (event) => {
                try {
                    const dataArray = JSON.parse(event.data);
                    updateTable(dataArray, dataTableContainer, isConnected);
                } catch (e) {
                    console.error("Ошибка парсинга JSON от сервера:", url, e);
                }
            };

            socket.onclose = () => {
                output.innerHTML = '<p class="close">Соединение закрыто</p>';
                removeStatusMessage(output, 'open', "Соединение установлено");
                isConnected = false;
                showNoDataMessage(dataTableContainer);
                
                setTimeout(() => {
                    console.log(`Попытка переподключения к ${url}...`);
                    connectWebSocket(url, output, dataTableContainer);
                }, reconnectionInterval);
            };

            socket.onerror = (error) => {
                console.error(`Ошибка сокета на ${url}:`, error);
                isConnected = false;
                showNoDataMessage(dataTableContainer);
            };
        }

        function updateTable(dataArray, dataTableContainer, isConnected) {
            if (!isConnected || !dataArray || dataArray.length === 0) {
                 showNoDataMessage(dataTableContainer);
                 return;
            }

            const tableWrapper = dataTableContainer.querySelector('.table-wrapper');
            const scrollPosition = tableWrapper ? tableWrapper.scrollTop : 0;

            const sortedData = [...dataArray].sort((a, b) => {
                const indexA = a.createIndex ?? a.CreateIndex ?? 0;
                const indexB = b.createIndex ?? b.CreateIndex ?? 0;
                return indexA - indexB;
            });

            let tableHTML = `
                <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Key</th>
                            <th>Value</th>
                            <th>CreateIndex</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            sortedData.forEach(data => {
                const key = data.key ?? data.Key ?? '—';
                const base64Value = data.value ?? data.Value ?? '';
                const createIndex = data.createIndex ?? data.CreateIndex ?? '—';
                
                let decodedValue = "";
                try {
                    decodedValue = base64Value ? atob(base64Value) : "—";
                } catch (e) {
                    decodedValue = "Ошибка декодирования";
                    console.error("Ошибка декодирования base64:", e);
                }

                tableHTML += `
                    <tr>
                        <td>${key}</td>
                        <!--<td>${decodedValue}</td>-->
                        <td>${data.value}</td>
                        <td>${createIndex}</td>
                    </tr>
                `;
            });

            tableHTML += `
                    </tbody>
                </table>
                </div>
            `;

            dataTableContainer.innerHTML = tableHTML;

            if (tableWrapper) {
                const newTableWrapper = dataTableContainer.querySelector('.table-wrapper');
                if (newTableWrapper) {
                    newTableWrapper.scrollTop = scrollPosition;
                }
            }
        }

        function showNoDataMessage(dataTableContainer) {
            dataTableContainer.innerHTML = '<p class="noData">Нет данных для отображения</p>';
        }

        function removeStatusMessage(outputElement, className, textContentStart) {
            const elements = outputElement.querySelectorAll('.' + className);
            elements.forEach(element => {
                if (element.textContent.startsWith(textContentStart)) {
                    element.remove();
                }
            });
        }

        connectWebSocket('ws://localhost:8765', output1, container1);
        connectWebSocket('ws://localhost:8766', output2, container2);
        connectWebSocket('ws://localhost:8767', output3, container3);
    </script>
</body>
</html>
