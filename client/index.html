<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>WebSocket Client</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div id="clients-container"></div>
    
    <script>
        const reconnectionInterval = 5000;
        const SCAN_INTERVAL = 3000;
        const REMOVE_DELAY = 5000;

        const ports = [8765, 8766, 8767, 8768, 8769, 8770, 8771, 8772, 8773, 8774];

        const sockets = {};
        const activePorts = {};
        const removeTimeouts = {};
        const portData = {};
        let clientCounter = 0;

        function removeStatusMessage(outputElement, className, textContentStart) {
            const elements = outputElement.querySelectorAll('.' + className);
            elements.forEach(element => {
                if (element.textContent.includes(textContentStart) || 
                    element.textContent.startsWith(textContentStart)) {
                    element.remove();
                }
            });
        }

        function showNoDataMessage(dataTableContainer) {
            dataTableContainer.innerHTML = '<p class="noData">Нет данных для отображения</p>';
        }

        function updateTable(dataArray, dataTableContainer, isConnected) {
            if (!dataArray || dataArray.length === 0) {
                 showNoDataMessage(dataTableContainer);
                 return;
            }

            const tableWrapper = dataTableContainer.querySelector('.table-wrapper');
            const scrollPosition = tableWrapper ? tableWrapper.scrollTop : 0;

            const sortedData = [...dataArray].sort((a, b) => {
                const indexA = a.createIndex ?? a.CreateIndex ?? 0;
                const indexB = b.createIndex ?? b.CreateIndex ?? 0;
                return indexA - indexB;
            });

            let tableHTML = `
                <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Key</th>
                            <th>Value</th>
                            <th>CreateIndex</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            sortedData.forEach(data => {
                const key = data.key ?? data.Key ?? '—';
                const base64Value = data.value ?? data.Value ?? '';
                const createIndex = data.createIndex ?? data.CreateIndex ?? '—';
                
                let decodedValue = "";
                try {
                    decodedValue = base64Value ? atob(base64Value) : "—";
                } catch (e) {
                    decodedValue = "Ошибка декодирования";
                    console.error("Ошибка декодирования base64:", e);
                }

                tableHTML += `
                    <tr>
                        <td>${key}</td>
                        <td>${data.value}</td>
                        <td>${createIndex}</td>
                    </tr>
                `;
            });

            tableHTML += `
                    </tbody>
                </table>
                </div>
            `;

            dataTableContainer.innerHTML = tableHTML;

            if (tableWrapper) {
                const newTableWrapper = dataTableContainer.querySelector('.table-wrapper');
                if (newTableWrapper) {
                    newTableWrapper.scrollTop = scrollPosition;
                }
            }
        }

        function createClientBlock(port) {
            const container = document.getElementById('clients-container');
            
            if (document.getElementById(`block-${port}`)) {
                return;
            }
            
            if (removeTimeouts[port]) {
                clearTimeout(removeTimeouts[port]);
                delete removeTimeouts[port];
            }
            
            clientCounter++;
            const block = document.createElement('div');
            block.className = 'client-block';
            block.id = `block-${port}`;
            block.innerHTML = `
                <h1>WebSocket Client${clientCounter}</h1>
                <h2>Connection Status:</h2>
                <div id="output-${port}"></div>
                <div id="data-table-container-${port}"></div>
            `;
            container.appendChild(block);
            
            activePorts[port] = true;
            
            if (portData[port]) {
                const container = document.getElementById(`data-table-container-${port}`);
                if (container) {
                    updateTable(portData[port], container, true);
                }
            }
        }

        function scheduleRemoveClientBlock(port) {
            if (removeTimeouts[port]) {
                return;
            }
            
            const output = document.getElementById(`output-${port}`);
            if (output) {
                removeStatusMessage(output, 'close', "Соединение закрыто");
                removeStatusMessage(output, 'open', "Соединение установлено");
                removeStatusMessage(output, 'close', "Попытка переподключения...");
                output.innerHTML += '<p class="close">Попытка переподключения...</p>';
            }
            
            removeTimeouts[port] = setTimeout(() => {
                if (sockets[port] && sockets[port].readyState === WebSocket.OPEN) {
                    delete removeTimeouts[port];
                    const output = document.getElementById(`output-${port}`);
                    if (output) {
                        removeStatusMessage(output, 'close', "Попытка переподключения...");
                        output.innerHTML += '<p class="open">Соединение восстановлено</p>';
                    }
                    return;
                }
                
                const block = document.getElementById(`block-${port}`);
                if (block) {
                    block.remove();
                    delete activePorts[port];
                    delete removeTimeouts[port];
                    
                    clientCounter = 0;
                    document.querySelectorAll('.client-block').forEach((el, index) => {
                        const h1 = el.querySelector('h1');
                        if (h1) {
                            h1.textContent = `WebSocket Client${index + 1}`;
                        }
                        clientCounter = index + 1;
                    });
                }
            }, REMOVE_DELAY);
        }

        function checkPort(port) {
            const url = `ws://localhost:${port}`;
            
            if (sockets[port] && sockets[port].readyState === WebSocket.OPEN) {
                return;
            }

            if (removeTimeouts[port]) {
                tryConnect(port);
                return;
            }

            if (activePorts[port] && (!sockets[port] || sockets[port].readyState === WebSocket.CLOSED)) {
                connectWebSocket(port);
                return;
            }

            tryConnect(port);
        }

        function tryConnect(port) {
            const url = `ws://localhost:${port}`;
            
            try {
                const testSocket = new WebSocket(url);
                let connected = false;

                const timeout = setTimeout(() => {
                    if (!connected) {
                        testSocket.close();
                        if (activePorts[port] && !removeTimeouts[port]) {
                            scheduleRemoveClientBlock(port);
                        }
                    }
                }, 1000);

                testSocket.onopen = () => {
                    connected = true;
                    clearTimeout(timeout);
                    if (!activePorts[port]) {
                        createClientBlock(port);
                    }
                    testSocket.close();
                    connectWebSocket(port);
                };

                testSocket.onerror = () => {
                    clearTimeout(timeout);
                    if (activePorts[port] && !removeTimeouts[port]) {
                        scheduleRemoveClientBlock(port);
                    }
                };

                testSocket.onclose = () => {
                    clearTimeout(timeout);
                    if (!connected && activePorts[port] && !removeTimeouts[port]) {
                        scheduleRemoveClientBlock(port);
                    }
                };

            } catch (e) {
                if (activePorts[port] && !removeTimeouts[port]) {
                    scheduleRemoveClientBlock(port);
                }
            }
        }

        function connectWebSocket(port) {
            if (!activePorts[port]) {
                createClientBlock(port);
            }

            if (removeTimeouts[port]) {
                clearTimeout(removeTimeouts[port]);
                delete removeTimeouts[port];
            }

            const url = `ws://localhost:${port}`;
            const output = document.getElementById(`output-${port}`);
            const dataTableContainer = document.getElementById(`data-table-container-${port}`);
            
            if (!output || !dataTableContainer) {
                return;
            }

            if (sockets[port]) {
                try {
                    sockets[port].close();
                } catch(e) {}
                delete sockets[port];
            }

            let socket = null;
            let isConnected = false; 

            socket = new WebSocket(url);
            sockets[port] = socket;

            socket.onopen = () => {
                removeStatusMessage(output, 'close', "Попытка переподключения...");
                output.innerHTML += '<p class="open">Соединение установлено</p>';
                isConnected = true;
                removeStatusMessage(output, 'close', "Соединение закрыто");
                removeStatusMessage(output, 'error', "Ошибка:");
                
                if (portData[port]) {
                    updateTable(portData[port], dataTableContainer, true);
                }
            };

            socket.onmessage = (event) => {
                try {
                    const dataArray = JSON.parse(event.data);
                    portData[port] = dataArray;
                    updateTable(dataArray, dataTableContainer, isConnected);
                } catch (e) {
                    console.error("Ошибка парсинга JSON от сервера:", url, e);
                }
            };

            socket.onclose = () => {
                output.innerHTML += '<p class="close">Соединение закрыто</p>';
                removeStatusMessage(output, 'open', "Соединение установлено");
                removeStatusMessage(output, 'close', "Попытка переподключения...");
                isConnected = false;
                delete sockets[port];
                
                scheduleRemoveClientBlock(port);
            };

            socket.onerror = (error) => {
                console.error(`Ошибка сокета на ${url}:`, error);
                isConnected = false;
                scheduleRemoveClientBlock(port);
            };
        }

        function scanPorts() {
            for (let i = 0; i < ports.length; i++) {
                const port = ports[i];
                checkPort(port);
            }
        }

        scanPorts();
        setInterval(scanPorts, SCAN_INTERVAL);

        window.addEventListener('beforeunload', () => {
            Object.values(sockets).forEach(socket => {
                try { socket.close(); } catch(e) {}
            });
            Object.values(removeTimeouts).forEach(timeout => {
                clearTimeout(timeout);
            });
        });
    </script>
</body>
</html>
